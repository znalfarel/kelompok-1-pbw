<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octacloud - VPS dan Web Hosting</title>
    <link rel="icon" href="../img/logo_octa.png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 400px; width: 100%;">

            <div class="text-center mb-4">
                <img src="../img/logo_octa.png" alt="Logo HostKita" width="65" class="mb-2">

                <h3 class="fw-bold">Selamat Datang!</h3>
                <p class="text-muted text-decoration-none mb-0">Login ke akun OctaCloud kamu</p>
            </div>
            
            <form action="../index.html" method="GET">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com"
                        autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Masukkan password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-orange w-100">
                    Login
                </button>
            </form>
            
            <p class="text-center mt-4 mb-2">
                Belum punya akun?
                <a href="register.html" class="text-orange text-decoration-none">
                    Daftar
                </a>
            </p>

            <div class="text-center">
                <a href="../index.html" class="text-muted text-decoration-none small">
                    ← Kembali ke Beranda
                </a>
            </div>

        </div>
    </div>
</body>

</html>
