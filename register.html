<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octacloud - VPS dan Web Hosting</title>
    <link rel="icon" href="img/logo_octa.png">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card shadow-sm border-0 rounded-4 p-4" style="max-width: 420px; width: 100%;">

            <!-- Header -->
            <div class="text-center mb-4">
                <img src="img/logo_octa.png" alt="Logo HostKita" width="65" class="mb-2">

                <h3 class="fw-bold">Buat Akun</h3>
                <p class="text-muted mb-0">
                    Daftar untuk mulai menggunakan layanan OctaCloud
                </p>
            </div>

            <!-- Form Register -->
            <form action="#" method="post">

                <div class="mb-3">
                    <label for="nama" class="form-label">
                        Nama Lengkap
                    </label>
                    <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap"
                        autocomplete="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com"
                        autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Minimal 8 karakter" minlength="8" autocomplete="new-password" required>
                </div>

                <div class="mb-3">
                    <label for="konfirmasi" class="form-label">
                        Konfirmasi Password
                    </label>
                    <input type="password" class="form-control" id="konfirmasi" name="konfirmasi"
                        placeholder="Ulangi password" minlength="8" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-orange w-100">
                    Daftar Sekarang
                </button>

            </form>

            <!-- Link Login -->
            <p class="text-center mt-4 mb-2">
                Sudah punya akun?
                <a href="login.html" class="text-orange text-decoration-none fw-semibold">
                    Login
                </a>
            </p>

            <!-- Link Beranda -->
            <div class="text-center">
                <a href="index.html" class="text-muted text-decoration-none small">
                    &larr; Kembali ke Beranda
                </a>
            </div>

        </div>
    </div>

</body>

</html>
